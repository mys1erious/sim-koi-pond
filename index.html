<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koi Pond</title>
<meta name="description" content="A koi pond you can touch: tap to feed the koi, drag to trail your finger. Real-time water simulation, refraction, caustics and floating maple leaves.">
<style>
  html, body { margin: 0; height: 100%; background: #0e1a14; overflow: hidden; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .ui { position: fixed; pointer-events: none; color: rgba(244, 240, 228, .9); font: 500 14px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: .02em; text-shadow: 0 1px 3px rgba(0, 0, 0, .75), 0 0 12px rgba(0, 0, 0, .45); }
  #title { top: max(14px, env(safe-area-inset-top)); left: 16px; font-size: 16px; font-weight: 600; }
  #hint { bottom: max(18px, env(safe-area-inset-bottom)); left: 16px; right: 16px; text-align: center; }
  #cur { position: fixed; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none; display: none;
         background: rgba(255, 255, 255, .28); border: 2px solid rgba(255, 255, 255, .85); box-shadow: 0 2px 10px rgba(0, 0, 0, .35); z-index: 9; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 16px; text-align: center; color: #eee; font: 15px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="title">koi pond</div>
<div class="ui" id="hint">tap to feed the koi &middot; drag to trail your finger</div>
<div id="cur"></div>
<div id="err">This pond needs WebGL2.</div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const CLEAN = Q.has('clean'), PLAY = Q.has('play');
if (CLEAN) document.querySelectorAll('.ui').forEach((e) => e.remove());
const cv = document.getElementById('c'), curEl = document.getElementById('cur');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: !!window.__recording });
if (!gl) { document.getElementById('err').style.display = 'grid'; throw new Error('no webgl2'); }
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('EXT_color_buffer_half_float'); gl.getExtension('OES_texture_float_linear');

// seeded PRNG: the recorder needs a repeatable pond
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261027);

// ---------- shaders ----------
const COMMON = `#version 300 es
precision highp float;
uniform vec2 uRes;
float pondSDF(vec2 p) {
  vec2 c = uRes * 0.5; float M = min(uRes.x, uRes.y);
  float m = max(26.0, M * 0.075);
  vec2 h = c - m; float r = min(h.x, h.y) * 0.55;
  vec2 q = abs(p - c) - (h - r);
  float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
  float a = atan(p.y - c.y, p.x - c.x);
  return d + M * 0.018 * (sin(3.0 * a + 1.3) + 0.7 * sin(5.0 * a + 0.4) + 0.5 * sin(9.0 * a + 2.1));
}
float hash1(vec2 p) { return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }
vec2 hash2(vec2 p) { return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1(i), hash1(i + vec2(1, 0)), f.x), mix(hash1(i + vec2(0, 1)), hash1(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s / 0.9375; }
// momiji (Japanese maple) leaf in unit space, css y-down, stem toward +y. returns coverage; vein/stem as out params
float momiji(vec2 l, float aa, out float vein, out float stem) {
  float r = length(l), la = atan(l.x, -l.y), e = 0.32; vein = 0.0;
  for (int i = -3; i <= 3; i++) {
    float ai = float(i) * 0.78, len = i == 0 ? 1.0 : abs(i) == 1 ? 0.93 : abs(i) == 2 ? 0.76 : 0.48, d = abs(la - ai);
    e = max(e, 0.3 + 0.7 * len * pow(max(0.0, 1.0 - d / 0.5), 1.2));
    vein = max(vein, (1.0 - smoothstep(0.0, 0.035, d * r)) * (1.0 - smoothstep(len * 0.75, len * 0.9, r)));
  }
  e *= 1.0 + 0.04 * sin(la * 46.0) * smoothstep(0.4, 0.8, r); // serrated edge
  stem = (1.0 - smoothstep(0.024, 0.024 + aa, abs(l.x + 0.05 * l.y * l.y))) * step(0.0, l.y) * (1.0 - smoothstep(0.6, 0.64, l.y));
  return 1.0 - smoothstep(e - aa, e, r);
}
`;
const VS_FULL = `#version 300 es
layout(location=0) in vec2 aP; out vec2 vUV;
void main() { vUV = aP * 0.5 + 0.5; gl_Position = vec4(aP, 0.0, 1.0); }`;

// static floor + rocky rim, rendered once per resize. rgb = color, a = water coverage * (1 - 0.45 * rim shadow)
const FS_STATIC = COMMON + `
in vec2 vUV; out vec4 o;
const vec3 SUN = vec3(-0.43, -0.53, 0.73); // css space (y down), points to the sun
// voronoi after iq, with a smooth-min border distance so cells come out as rounded stones:
// x = distance to the (rounded) border, yz = vector to the feature point, w = cell id
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
vec4 voro(vec2 x, float k) {
  vec2 n = floor(x), f = fract(x), mg, mr; float md = 8.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(i, j), r = g + 0.15 + 0.7 * hash2(n + g) - f; float d = dot(r, r);
    if (d < md) { md = d; mr = r; mg = g; } }
  md = 8.0;
  for (int j = -2; j <= 2; j++) for (int i = -2; i <= 2; i++) {
    vec2 g = mg + vec2(i, j), r = g + 0.15 + 0.7 * hash2(n + g) - f;
    if (dot(mr - r, mr - r) > 1e-5) md = smin(md, dot(0.5 * (mr + r), normalize(r - mr)), k); }
  return vec4(md, mr, hash1(n + mg));
}
vec3 stoneCol(float id) {
  vec3 c = id < 0.22 ? vec3(0.72, 0.64, 0.52) : id < 0.42 ? vec3(0.52, 0.51, 0.48) : id < 0.58 ? vec3(0.66, 0.46, 0.32)
         : id < 0.76 ? vec3(0.34, 0.35, 0.36) : id < 0.9 ? vec3(0.82, 0.78, 0.68) : vec3(0.45, 0.36, 0.30);
  return c * (0.82 + 0.36 * fract(id * 13.7));
}
float sR;
vec4 rockAt(vec2 p, out float id) { // x coverage, y border distance, zw vector to the rock's centre (cell units)
  vec4 v = voro(p / sR + vec2(3.7, 1.3), 0.35);
  id = v.w;
  float ed = v.x + 0.05 * (vnoise(p / sR * 5.0) - 0.5);
  float isRock = step(-0.06 * sR, pondSDF(p + v.yz * sR));
  return vec4(isRock * smoothstep(0.035, 0.065, ed), ed, v.yz);
}
// rounded stone: a dome over the cell, steeper toward its border
vec3 domeN(vec2 toCenter, float ed, float slope, vec2 bump) {
  float k = 1.0 - smoothstep(0.0, slope, ed);
  return normalize(vec3(-normalize(toCenter + 1e-5) * (0.25 + 1.5 * k * k) + bump, 1.0));
}
void main() {
  vec2 p = vec2(vUV.x, 1.0 - vUV.y) * uRes; float M = min(uRes.x, uRes.y);
  sR = M / 8.5;
  float sdf = pondSDF(p);
  float rid; vec4 rk = rockAt(p, rid);
  // boulders and the ground between them
  vec2 bump = vec2(vnoise(p * 0.07), vnoise(p * 0.07 + 7.0)) - 0.5;
  vec3 rn = domeN(rk.zw, rk.y, 0.42, bump * 0.35);
  float dif = max(dot(rn, SUN), 0.0);
  vec3 rc = mix(vec3(0.46, 0.44, 0.40), vec3(0.70, 0.67, 0.60), fract(rid * 7.3)) * (0.88 + 0.24 * fbm(p * 0.12));
  rc *= mix(vec3(1.06, 1.0, 0.92), vec3(0.92, 0.98, 1.06), fbm(p * 0.035 + rid * 5.0)); // warm/cool mottling
  rc *= 0.86 + 0.16 * vnoise(p * 0.9) + 0.08 * vnoise(p * 2.3);                         // granite grain
  rc *= 1.0 - 0.16 * (1.0 - smoothstep(0.0, 0.02, abs(vnoise(p * 0.045 + rid * 9.0) - 0.5))) * smoothstep(0.1, 0.25, rk.y); // hairline cracks
  float moss = smoothstep(0.5, 0.66, fbm(p / sR * 2.2 + rid * 10.0)) * smoothstep(0.12, 0.3, rk.y);
  moss *= smoothstep(0.25, 0.55, vnoise(p * 0.3)) * (1.2 - 0.6 * dif);                 // broken up, thicker on the shaded side
  vec3 mossC = mix(vec3(0.16, 0.27, 0.07), vec3(0.36, 0.44, 0.12), vnoise(p * 0.12)) * (0.7 + 0.6 * vnoise(p * 1.4));
  rc = mix(rc, mossC, clamp(moss, 0.0, 1.0) * 0.85);
  rc = mix(rc, vec3(0.74, 0.76, 0.66), smoothstep(0.8, 0.86, vnoise(p * 0.21 + rid * 3.0)) * 0.45); // pale lichen spots
  float wet = 1.0 - smoothstep(-0.05 * sR, 0.25 * sR, sdf);
  rc *= mix(1.0, 0.62, wet);
  rc *= 0.28 + 0.95 * dif;
  rc += vec3(0.9, 0.92, 0.85) * pow(max(dot(rn, normalize(SUN + vec3(0.0, 0.0, 1.0))), 0.0), 30.0) * (0.06 + 0.3 * wet); // wet sheen at the waterline
  rc *= 0.75 + 0.25 * smoothstep(0.035, 0.2, rk.y); // contact darkening at the rock's foot
  vec4 sm = voro(p / (sR * 0.42) + 5.1, 0.25);
  float smOn = step(-0.02 * sR, pondSDF(p + sm.yz * sR * 0.42)) * smoothstep(0.05, 0.09, sm.x);
  vec3 smn = domeN(sm.yz, sm.x, 0.4, bump * 0.3);
  vec3 smc = stoneCol(sm.w) * 0.85 * (0.3 + 0.9 * max(dot(smn, SUN), 0.0)) * mix(1.0, 0.6, wet);
  vec3 ground = mix(vec3(0.07, 0.08, 0.04), vec3(0.13, 0.19, 0.07), fbm(p * 0.03)) * (0.7 + 0.5 * vnoise(p * 0.4));
  ground = mix(ground, smc, smOn);
  ground *= 0.55 + 0.45 * smoothstep(0.0, 0.25, rk.y); // shade under the boulders
  vec3 rim = mix(ground, rc, rk.x);
  // a few fallen maple leaves on the stones, dried darker than the floating ones
  vec2 lc = floor(p / (M * 0.11)), lj = hash2(lc + 4.7);
  if (hash1(lc + 9.2) > 0.72) {
    float la = lj.x * 6.283, cs = cos(la), sn = sin(la), ls = M * (0.024 + 0.01 * lj.y);
    vec2 l = mat2(cs, sn, -sn, cs) * (p - (lc + 0.32 + 0.36 * lj) * M * 0.11) / ls;
    float lv, lst, lm = momiji(l, 0.08, lv, lst);
    vec3 lcol = mix(vec3(0.62, 0.12, 0.05), vec3(0.75, 0.38, 0.08), lj.y) * (0.75 + 0.3 * vnoise(l * 6.0)) * (1.0 + 0.2 * lv);
    rim = mix(rim * (0.65 + 0.35 * smoothstep(0.6, 1.4, length(l - vec2(0.25, 0.3)))), lcol * (0.45 + 0.75 * dif), max(lm, lst));
  }
  // pond floor: rounded pebbles on silt, a few bigger stones, algae
  float s1 = M / 36.0;
  vec4 v = voro(p / s1, 0.3);
  float ed = v.x + 0.04 * (vnoise(p / s1 * 3.0) - 0.5);
  vec3 pn = domeN(v.yz, ed, 0.3, vec2(0.0));
  vec3 fc = mix(vec3(0.15, 0.13, 0.09) * (0.75 + 0.5 * vnoise(p * 0.15)),
                stoneCol(v.w) * (0.42 + 0.75 * max(dot(pn, SUN), 0.0)) * (0.9 + 0.2 * vnoise(p * 0.4)),
                smoothstep(0.05, 0.1, ed));
  float sand = smoothstep(0.42, 0.58, fbm(p / M * 2.6 + 5.0));
  vec3 sc = vec3(0.60, 0.53, 0.40) * (0.85 + 0.25 * vnoise(p * 0.08) + 0.1 * vnoise(p * 0.9));
  fc = mix(fc, sc, sand * (1.0 - smoothstep(0.1, 0.0, ed) * 0.0));
  float s2 = M / 12.0;
  vec4 b = voro(p / s2 + 11.3, 0.35);
  float ba = b.w * 40.0; vec2 bq = mat2(cos(ba), sin(ba), -sin(ba), cos(ba)) * b.yz * vec2(1.0, 1.35); // oval stone around the feature point
  float bed = 0.28 + 0.1 * fract(b.w * 17.0) - length(bq) + 0.04 * (vnoise(p / s2 * 4.0) - 0.5);
  float big = step(0.82, b.w);
  vec3 bn = domeN(b.yz, bed, 0.25, bump * 0.25);
  fc *= 1.0 - 0.3 * big * smoothstep(-0.1, 0.0, bed); // contact shadow
  fc = mix(fc, mix(vec3(0.78, 0.72, 0.6), vec3(0.6, 0.5, 0.42), fract(b.w * 31.0)) * (0.5 + 0.7 * max(dot(bn, SUN), 0.0)) * (0.9 + 0.2 * vnoise(p * 0.25)), big * smoothstep(0.0, 0.015, bed));
  fc *= 0.88 + 0.2 * vnoise(p * 1.1);                                                       // grain on the pebbles
  fc = mix(fc, vec3(0.30, 0.27, 0.18), smoothstep(0.45, 0.75, fbm(p / M * 7.0 + 9.0)) * 0.35); // a film of silt
  float al = smoothstep(0.5, 0.78, fbm(p / M * 4.0 + 2.0));
  fc = mix(fc, fc * vec3(0.5, 0.8, 0.3) + vec3(0.02, 0.05, 0.0), al * 0.75);
  fc *= mix(0.45, 1.0, smoothstep(0.0, 0.12 * M, -sdf)); // the wall going down
  // shadow cast by the rim toward the floor
  vec2 toSun = normalize(SUN.xy);
  float sh = 0.0;
  for (int i = 1; i <= 2; i++) {
    vec2 q = p + toSun * M * 0.035 * float(i); float qid;
    sh += 0.5 * max(rockAt(q, qid).x, smoothstep(-4.0, 4.0, pondSDF(q)));
  }
  float water = (1.0 - rk.x) * (1.0 - smoothstep(-1.5, 1.5, sdf));
  fc *= 1.0 - 0.4 * sh;
  o = vec4(mix(rim, fc, water), water * (1.0 - 0.45 * sh));
}`;

const FS_SIM = `#version 300 es
precision highp float;
uniform sampler2D uS, uStatic; uniform vec2 uTx, uSim; uniform vec4 uD[16]; uniform int uN;
in vec2 vUV; out vec4 o;
void main() {
  vec4 s = texture(uS, vUV);
  float avg = 0.25 * (texture(uS, vUV + vec2(uTx.x, 0.0)).r + texture(uS, vUV - vec2(uTx.x, 0.0)).r
                    + texture(uS, vUV + vec2(0.0, uTx.y)).r + texture(uS, vUV - vec2(0.0, uTx.y)).r);
  s.g += (avg - s.r) * 2.0;
  s.g *= 0.995;
  s.r += s.g;
  s.r *= 0.9995;
  for (int i = 0; i < 16; i++) {
    if (i >= uN) break;
    float d = length((vUV - uD[i].xy) * uSim) / uD[i].z;
    if (d < 1.0) s.r += uD[i].w * (0.5 + 0.5 * cos(3.14159 * d));
  }
  if (texture(uStatic, vUV).a < 0.3) s = vec4(0.0); // the stone edge reflects the waves
  o = s;
}`;

const FS_COPY = `#version 300 es
precision highp float;
uniform sampler2D uStatic; in vec2 vUV; out vec4 o;
void main() { o = vec4(texture(uStatic, vUV).rgb, 1.0); }`;

const FS_WATER = COMMON + `
uniform sampler2D uH, uStatic, uScene; uniform vec2 uTx; uniform float uT;
in vec2 vUV; out vec4 o;
float caust(vec2 p, float t) { // after Dave_Hoskins / joltz0r "Tileable Water Caustic"
  p -= 250.0; vec2 i = p; float c = 1.0; const float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}
vec3 sky(vec3 R) {
  vec3 c = mix(vec3(0.70, 0.80, 0.84), vec3(0.32, 0.52, 0.76), clamp(R.z, 0.0, 1.0));
  vec2 sp = R.xy / max(R.z, 0.2) * 1.6 + vec2(uT * 0.015, 0.0);
  c = mix(c, vec3(0.94, 0.95, 0.96), smoothstep(0.45, 0.8, vnoise(sp * 1.5) * 0.65 + vnoise(sp * 3.7) * 0.35) * 0.7);
  float leaf = smoothstep(0.0, 0.06, R.x * 0.8 - R.y * 0.7 - 0.36 + 0.16 * vnoise(R.xy * 14.0) + 0.07 * vnoise(R.xy * 40.0));
  return mix(c, vec3(0.04, 0.10, 0.05), leaf * 0.9);
}
void main() {
  vec4 st = texture(uStatic, vUV);
  vec2 p = vec2(vUV.x, 1.0 - vUV.y) * uRes; float M = min(uRes.x, uRes.y);
  vec2 q = (vUV - 0.5) * uRes / M;
  float vig = 1.0 - 0.28 * dot(q, q);
  float wm = smoothstep(0.0, 0.5, st.a);
  if (wm <= 0.0) { o = vec4(st.rgb * vig, 1.0); return; }
  float h = texture(uH, vUV).r;
  float hl = texture(uH, vUV - vec2(uTx.x, 0.0)).r, hr = texture(uH, vUV + vec2(uTx.x, 0.0)).r;
  float hd = texture(uH, vUV - vec2(0.0, uTx.y)).r, hu = texture(uH, vUV + vec2(0.0, uTx.y)).r;
  vec2 gs = vec2(hl - hr, hd - hu), g = gs * 3.0;
  // a breath of wind so a calm pond still shimmers
  vec2 w1 = p * (12.0 / M) + vec2(uT * 0.25, uT * 0.1), w2 = w1 * 2.7 + vec2(-uT * 0.5, uT * 0.35);
  float n0 = vnoise(w1) + 0.5 * vnoise(w2);
  g += 0.25 * vec2(n0 - vnoise(w1 + vec2(0.05, 0.0)) - 0.5 * vnoise(w2 + vec2(0.135, 0.0)),
                   vnoise(w1 + vec2(0.0, 0.05)) + 0.5 * vnoise(w2 + vec2(0.0, 0.135)) - n0);
  vec3 n = normalize(vec3(g, 1.0));
  float lap = hl + hr + hd + hu - 4.0 * h;
  float sdf = pondSDF(p);
  float depthF = 0.35 + 0.65 * smoothstep(0.0, 0.3 * M, -sdf);
  vec4 sc = texture(uScene, vUV + n.xy * 0.05 * M * depthF / uRes);
  float fl = sc.a; // 1 = floor, 0 = fish
  float depth = mix(0.16, depthF, fl);
  float lit = clamp((st.a - 0.55) / 0.45, 0.0, 1.0);
  float c = caust(p / (0.075 * M) + n.xy * 1.5, uT * 0.5);
  float focus = clamp(-lap * 9.0, -0.6, 2.0);
  float cl = (c * 2.0 + focus) * mix(0.3, 1.0, fl) * (0.2 + 0.8 * lit);
  vec3 col = sc.rgb * (0.62 + cl);
  vec3 ab = exp(-depth * vec3(1.75, 0.66, 0.74) * 1.25);
  col = col * ab + vec3(0.02, 0.085, 0.075) * (1.0 - ab.g) + vec3(0.55, 0.85, 0.7) * max(cl, 0.0) * 0.1 * fl;
  vec3 V = normalize(vec3(-q * 0.55, 1.0));
  vec3 R = reflect(-V, n);
  float fres = 0.05 + 0.95 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
  col = mix(col, sky(R), clamp(fres * 1.5 + 0.02, 0.0, 0.8));
  // ring faces turned to the sun catch light, the backs go dark: the rings read anywhere on the pond, not just in the glare
  float slope = dot(gs, vec2(-0.63, 0.78)) * 4.0;
  col = col * (1.0 + clamp(slope, -0.45, 0.0)) + vec3(0.75, 0.88, 0.85) * clamp(slope, 0.0, 0.6) * 0.55;
  vec3 L = normalize(vec3(-0.13, 0.17, 1.0));
  float nh = max(dot(n, normalize(L + V)), 0.0);
  col += vec3(1.0, 0.96, 0.86) * (pow(nh, 6000.0) * 1.3 + pow(nh, 500.0) * 0.06) * (0.3 + 0.7 * lit);
  o = vec4(mix(st.rgb, col, wm) * vig, 1.0);
}`;

const VS_FISH = `#version 300 es
layout(location=0) in vec2 aP; layout(location=1) in vec2 aU; layout(location=2) in vec3 aK;
uniform vec2 uRes, uOff; out vec2 vU; out vec3 vK;
void main() { vU = aU; vK = aK; vec2 p = (aP + uOff) / uRes; gl_Position = vec4(p.x * 2.0 - 1.0, 1.0 - p.y * 2.0, 0.0, 1.0); }`;
const FS_FISH = COMMON + `
uniform float uShadow; in vec2 vU; in vec3 vK; out vec4 o;
vec3 skin(float u, float v, float type, float seed) {
  vec3 W = vec3(0.97, 0.95, 0.90), R = vec3(0.98, 0.30, 0.05), B = vec3(0.04, 0.04, 0.05);
  vec2 pc = vec2(u * 3.4, v * 0.8) + seed * 7.31;
  float n1 = fbm(pc), n2 = fbm(pc * 2.3 + 5.3);

      b[0] = a[0] + dx / dd * s; b[1] = a[1] + dy / dd * s;
    }
    if (f.v > f.L * 1.1) disturb(f.x, f.y, 3, 0.012 * f.v / f.L); // darting koi leave a wake
    if ((f.kiss -= dt) < 0) { f.kiss = 5 + rnd() * 9; if (f.scare < 0.1) wave(f.x + Math.cos(f.a) * f.L * 0.05, f.y + Math.sin(f.a) * f.L * 0.05, 3, 0.35); }
  }
  while (events.length && T - events[0].t > 1) events.shift();
}
let nv = 0;
function vtx(x, y, u, v, part, f) { FISH_BUF.set([x, y, u, v, part, f.type, f.seed], nv * 7); nv++; }
function quad(a, b, c, d, part, f) { for (const q of [a, b, c, a, c, d]) vtx(q[0], q[1], q[2], q[3], part, f); }
function buildFish() {
  nv = 0;
  for (const f of fish) {
    const amp = f.W * (1 + 0.6 * Math.min(1, f.scare)), pts = [], tan = [];
    for (let j = 0; j < NP; j++) {
      const a = f.pts[Math.max(0, j - 1)], b = f.pts[Math.min(NP - 1, j + 1)];
      let tx = a[0] - b[0], ty = a[1] - b[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const s = j <= NB ? j / NB : 1 + (j - NB) / NT * 0.42, lat = amp * (0.12 + 1.0 * s * s) * Math.sin(f.phase - 5 * s);
      pts.push([f.pts[j][0] - ty * lat, f.pts[j][1] + tx * lat]); tan.push([tx, ty]);
    }
    // tail fin
    for (let j = NB; j < NP - 1; j++) {
      const w0 = f.W * (0.18 + 1.25 * ((j - NB) / (NT - 1)) ** 0.9), w1 = f.W * (0.18 + 1.25 * ((j + 1 - NB) / (NT - 1)) ** 0.9);
      const [p0, p1, t0, t1] = [pts[j], pts[j + 1], tan[j], tan[j + 1]], u0 = (j - NB) / (NT - 1), u1 = (j + 1 - NB) / (NT - 1);
      quad([p0[0] - t0[1] * w0, p0[1] + t0[0] * w0, u0, 1], [p1[0] - t1[1] * w1, p1[1] + t1[0] * w1, u1, 1],
           [p1[0] + t1[1] * w1, p1[1] - t1[0] * w1, u1, -1], [p0[0] + t0[1] * w0, p0[1] - t0[0] * w0, u0, -1], 1, f);
    }
    // pelvic and pectoral fins
    for (const [jf, len, ang, wid] of [[11, 0.11, 0.75, 0.04], [4, 0.21, 0.95, 0.065]]) {
      const [px, py] = pts[jf], [tx, ty] = tan[jf], w = f.W * bodyW(jf / NB) * 0.8;
      for (const side of [1, -1]) {
        const an = side * (ang + 0.25 * Math.sin(f.phase * 0.5 + side) - 0.55 * Math.min(1, f.scare));
        const nx = -ty * side, ny = tx * side; // outward normal
        const rx = px + nx * w, ry = py + ny * w;
        const dx = -tx * Math.cos(Math.abs(an)) + nx * Math.sin(Math.abs(an)), dy = -ty * Math.cos(Math.abs(an)) + ny * Math.sin(Math.abs(an));
        const L = f.L * len, tw = f.L * wid, rw = f.L * 0.025;
        quad([rx + tx * rw, ry + ty * rw, 0, -1], [rx + dx * L - dy * tw, ry + dy * L + dx * tw, 1, -1],
             [rx + dx * L + dy * tw, ry + dy * L - dx * tw, 1, 1], [rx - tx * rw, ry - ty * rw, 0, 1], 2, f);
      }
    }
    // body
    for (let j = 0; j < NB; j++) {
      const s0 = j / NB, s1 = (j + 1) / NB, w0 = f.W * bodyW(s0), w1 = f.W * bodyW(s1), [p0, p1, t0, t1] = [pts[j], pts[j + 1], tan[j], tan[j + 1]];
      quad([p0[0] - t0[1] * w0, p0[1] + t0[0] * w0, s0, 1], [p1[0] - t1[1] * w1, p1[1] + t1[0] * w1, s1, 1],
           [p1[0] + t1[1] * w1, p1[1] - t1[0] * w1, s1, -1], [p0[0] + t0[1] * w0, p0[1] - t0[0] * w0, s0, -1], 0.45 * Math.min(1, f.gulp * 5), f);
    }
  }

}
function drawFish(shadow) {
  gl.useProgram(P.fish.p); gl.uniform2f(P.fish.u('uRes'), W, H);
  gl.uniform2f(P.fish.u('uOff'), shadow ? M * 0.045 : 0, shadow ? M * 0.06 : 0); gl.uniform1f(P.fish.u('uShadow'), shadow ? 1 : 0);
  gl.bindVertexArray(FISHV.a); gl.drawArrays(gl.TRIANGLES, 0, nv);
}

// ---------- lily pads ----------
const pads = [[0.80, 0.16, 0.10, 0], [0.67, 0.10, 0.055, 0], [0.19, 0.80, 0.095, 1], [0.32, 0.89, 0.06, 0], [0.88, 0.62, 0.065, 0]]
  .map(([fx, fy, fr, flower], i) => ({ fx, fy, fr, flower, seed: rnd(), rot: rnd() * 6.283, x: 0, y: 0, r: 0 }));
function padSetup() {
  gl.useProgram(P.pad.p); bindTex(0, hA.t);
  gl.uniform1i(P.pad.u('uH'), 0); gl.uniform2f(P.pad.u('uRes'), W, H); gl.uniform2f(P.pad.u('uTx'), 1 / SW, 1 / SH);
  gl.bindVertexArray(QUAD.a);
}
function padDraw(x, y, r, rot, kind, seed, grow, off, shade) {
  gl.uniform3f(P.pad.u('uPad'), x, y, r); gl.uniform1f(P.pad.u('uRot'), rot); gl.uniform1f(P.pad.u('uGrow'), grow);
  gl.uniform1f(P.pad.u('uKind'), kind); gl.uniform1f(P.pad.u('uSeed'), seed); gl.uniform1f(P.pad.u('uPx'), r * BW / W);
  gl.uniform1f(P.pad.u('uShade'), shade); gl.uniform2f(P.pad.u('uOff'), off[0], off[1]); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function drawPads(kind, off) {
  padSetup();
  for (const p of pads) {
    const rot = p.rot + 0.15 * Math.sin(T * 0.11 + p.seed * 9);
    padDraw(p.x, p.y, p.r, rot, kind, p.seed, 1.25, off, 0);
    if (p.flower && kind === 0) padDraw(p.x + p.r * 0.12, p.y - p.r * 0.08, p.r * 0.5, rot, 1, p.seed, 1.25, off, 0);
  }
}

// ---------- things floating on the surface: maple leaves and koi food ----------
const leaves = [], food = [], rings = [];
function wave(x, y, radiusCells, strength) { disturb(x, y, radiusCells, strength); rings.push({ x, y, t: T, s: strength }); }
function spawnLeaves() {
  for (let i = 0; i < 6; i++) {
    let x, y; do { x = W * (0.12 + 0.76 * rnd()); y = H * (0.12 + 0.76 * rnd()); } while (pondSDF(x, y) > -M * 0.12);
    leaves.push({ x, y, fr: 0.04 + 0.016 * rnd(), rot: rnd() * 6.283, spin: (rnd() - 0.5) * 0.12, seed: rnd(), vx: 0, vy: 0 });
  }
}
function feed(x, y) { // a handful of pellets, landing a few hundredths of a second apart
  for (let i = 0; i < 7; i++) {
    const a = rnd() * 6.283, r = M * 0.045 * Math.sqrt(rnd());
    food.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, vx: 0, vy: 0, at: T + 0.05 * i, landed: false, seed: rnd() });
  }
}
function updateFloaters(dt) {
  const c = M * 0.28; // ring speed in css px/s (sim: ~0.7 cell per 1/120 s step, cell = M/300)
  const wa = 0.6 + 2.5 * Math.sin(T * 0.013), wx = Math.cos(wa) * M * 0.003, wy = Math.sin(wa) * M * 0.003; // a slow breeze
  for (const o of [...leaves, ...food]) {
    if (o.at !== undefined && !o.landed) { if (T < o.at) continue; o.landed = true; wave(o.x, o.y, 3, 0.5); }
    for (const g of rings) { // a passing ring pushes the floater outward
      const age = T - g.t, dx = o.x - g.x, dy = o.y - g.y, d = Math.hypot(dx, dy) || 1;
      if (age < 2 && Math.abs(d - c * age) < M * 0.025) { const k = g.s * M * (o.fr ? 0.9 : 0.12) * (1 - age / 2) / (1 + d / (M * 0.15)); o.vx += dx / d * k * dt; o.vy += dy / d * k * dt; }
    }
    o.vx += (wx - o.vx) * Math.min(1, dt * 1.2); o.vy += (wy - o.vy) * Math.min(1, dt * 1.2);
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.fr) o.rot += (o.spin + o.vx / M * 0.8) * dt;
    const keep = M * (o.fr ? 0.06 + o.fr : 0.13), sd = pondSDF(o.x, o.y); // clear of the boulders; food stays where koi can reach it
    if (sd > -keep) {
      const gx = pondSDF(o.x + 1, o.y) - pondSDF(o.x - 1, o.y), gy = pondSDF(o.x, o.y + 1) - pondSDF(o.x, o.y - 1), gl2 = Math.hypot(gx, gy) || 1;
      const nx = gx / gl2, ny = gy / gl2, vn = o.vx * nx + o.vy * ny;
      o.x -= nx * (sd + keep); o.y -= ny * (sd + keep); if (vn > 0) { o.vx -= 1.5 * vn * nx; o.vy -= 1.5 * vn * ny; }
    }
  }
  for (const a of leaves) for (const b of leaves) if (a !== b) { // leaves bump instead of stacking
    const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 1, r = (a.fr + b.fr) * M * 0.9;
    if (d < r) { a.vx += dx / d * (r - d) * 2 * dt * 60; a.vy += dy / d * (r - d) * 2 * dt * 60; }

function drawFloaters(shade, off) {
  padSetup();
  for (const l of leaves) padDraw(l.x, l.y, l.fr * M, l.rot, 4, l.seed, 1.15, off, shade);
  for (const p of food) if (p.landed) padDraw(p.x, p.y, M * 0.0075, 0, 3, p.seed, 1.6, off, shade);
}

// ---------- input ----------
function trail(x0, y0, x1, y1) {
  const cell = M / 300, step = cell * 2.5, len = Math.hypot(x1 - x0, y1 - y0);
  let s = step - ptr.carry;
  for (; s <= len; s += step) disturb(x0 + (x1 - x0) * s / len, y0 + (y1 - y0) * s / len, 4.5, 0.11);
  ptr.carry = len - (s - step);
  if (T - ptr.lastEv > 0.05) { events.push({ x: x1, y: y1, t: T, r: M * 0.22 }); ptr.lastEv = T; lastScare = T; }
  for (const o of [...leaves, ...food]) { // the finger drags floaters along
    const d = Math.hypot(o.x - x1, o.y - y1), R = M * 0.07;
    if (d < R) { o.vx += (x1 - x0) * 1.5 * (1 - d / R); o.vy += (y1 - y0) * 1.5 * (1 - d / R); }
  }
}
// a tap feeds the koi, a drag is a finger in the water (they scatter)
function pDown(x, y) { ptr.down = true; ptr.x = ptr.sx = x; ptr.y = ptr.sy = y; ptr.carry = 0; ptr.drag = false; const h = document.getElementById('hint'); if (h) h.remove(); }
function pMove(x, y) {
  if (ptr.down && !ptr.drag && Math.hypot(x - ptr.sx, y - ptr.sy) > M * 0.02) { ptr.drag = true; ptr.x = ptr.sx; ptr.y = ptr.sy; }
  if (ptr.drag) trail(ptr.x, ptr.y, x, y);
  ptr.x = x; ptr.y = y; ptr.seen = T;
}
function pUp() { if (ptr.down && !ptr.drag) feed(ptr.sx, ptr.sy); ptr.down = false; ptr.drag = false; }
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); pDown(e.clientX, e.clientY); });
cv.addEventListener('pointermove', (e) => pMove(e.clientX, e.clientY));
addEventListener('pointerup', pUp); addEventListener('pointercancel', pUp);

// ?play: replays video/keys.json (recorder format, authored for 1080x1350) with its own touch cursor
let KEYS = null;
if (PLAY) fetch('video/keys.json').then((r) => r.json()).then((k) => { KEYS = k; }).catch(() => {});
const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (p2 - p0) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (3 * p1 - p0 - 3 * p2 + p3) * t * t * t);
function keyAt(t) {
  const K = KEYS; if (!K || t < K[0].t) return null;
  for (let i = 0; i < K.length - 1; i++) {
    const a = K[i], b = K[i + 1]; if (t > b.t) continue;
    const k = Math.min(1, (t - a.t) / (b.t - a.t || 1));
    if (a.down && b.down) { // smooth drag through the neighbouring keys
      const p0 = K[i - 1] && K[i - 1].down ? K[i - 1] : a, p3 = K[i + 2] && K[i + 2].down ? K[i + 2] : b;
      return { x: cr(p0.x, a.x, b.x, p3.x, k), y: cr(p0.y, a.y, b.y, p3.y, k), down: true, hide: !!a.hide };
    }
    const e = k * k * (3 - 2 * k);
    return { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e, down: !!a.down, hide: !!a.hide };
  }
  const z = K[K.length - 1]; return { x: z.x, y: z.y, down: !!z.down, hide: !!z.hide };
}
function playUpdate() {
  if (!KEYS) return;
  const span = KEYS[KEYS.length - 1].t + 2, p = keyAt(T % span);
  if (!p || p.hide) { curEl.style.display = 'none'; if (ptr.down) pUp(); return; }
  const x = p.x * W / 1080, y = p.y * H / 1350;
  if (p.down && !ptr.down) pDown(x, y); else if (!p.down && ptr.down) pUp();
  pMove(x, y);
  curEl.style.display = 'block';
  curEl.style.transform = `translate(${x}px, ${y}px) scale(${p.down ? 0.8 : 1})`;
  curEl.style.background = p.down ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.28)';
}

// ---------- frame ----------
function render() {
  buildFish();
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.f); gl.viewport(0, 0, BW, BH);
  gl.disable(gl.BLEND);
  gl.useProgram(P.copy.p); bindTex(1, stat.t); gl.uniform1i(P.copy.u('uStatic'), 1);
  gl.bindVertexArray(TRI.a); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE); // shadows keep the floor mask
  drawPads(2, [M * 0.05, M * 0.065]);
  drawFloaters(1, [M * 0.05, M * 0.065]);
  drawFish(true);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE_MINUS_SRC_ALPHA); // alpha -> 0 where a koi is
  drawFish(false);
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, BW, BH);
  const w = P.water; gl.useProgram(w.p);
  bindTex(0, hA.t); bindTex(1, stat.t); bindTex(2, scene.t);
  gl.uniform1i(w.u('uH'), 0); gl.uniform1i(w.u('uStatic'), 1); gl.uniform1i(w.u('uScene'), 2);
  gl.uniform2f(w.u('uRes'), W, H); gl.uniform2f(w.u('uTx'), 1 / SW, 1 / SH); gl.uniform1f(w.u('uT'), T);
  gl.bindVertexArray(TRI.a); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  drawPads(0, [0, 0]);
  drawFloaters(0, [0, 0]);
  gl.disable(gl.BLEND);
}
const STEP = 1 / 120;
let last = null, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  resize();
  const t = now / 1000, dt = last === null ? 1 / 60 : Math.min(0.05, Math.max(0, t - last)); last = t;
  T += dt;
  if (PLAY) playUpdate();
  updateFish(dt);
  updateFloaters(dt);
  acc += dt; let n = 0;
  while (acc >= STEP && n < 8) { simStep(); acc -= STEP; n++; }
  if (n === 8) acc = 0;
  render();
}
resize();
spawnFish();
spawnLeaves();
// warm up so the very first frame is already alive: koi spread out, a couple of rings on the water
for (let i = 0; i < 180; i++) { T += 1 / 60; updateFish(1 / 60); updateFloaters(1 / 60); if (i > 60) { simStep(); simStep(); } }
T = 0; events.length = 0; rings.length = 0;
requestAnimationFrame(frame);
</script>
